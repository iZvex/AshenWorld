name: Проверки и сборка ASHEN WORLD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Разделяем очереди для отправки кода и ручного запуска, чтобы ручной
# прогон не отменялся автоматическим и наоборот.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  # Определяем, что уже появилось в репозитории. Пока это только спецификация,
  # тяжёлые задания честно пропускаются, а не завершаются ошибкой.
  detect:
    name: Состав репозитория
    runs-on: ubuntu-latest
    outputs:
      has_project: ${{ steps.d.outputs.has_project }}
      has_preset: ${{ steps.d.outputs.has_preset }}
    steps:
      - name: Получение исходников
        uses: actions/checkout@v4
      - name: Проверка наличия Godot-проекта и Android-пресета
        id: d
        run: |
          has_project=false
          has_preset=false
          if [ -f project.godot ]; then has_project=true; fi
          if [ -f export_presets.cfg ] && grep -q 'platform="Android"' export_presets.cfg; then
            has_preset=true
          fi
          echo "has_project=$has_project" >> "$GITHUB_OUTPUT"
          echo "has_preset=$has_preset" >> "$GITHUB_OUTPUT"
          printf 'has_project=%s  has_preset=%s\n' "$has_project" "$has_preset"

  validate:
    name: Проверка репозитория и скриптов
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - name: Получение исходников
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка PyYAML
        run: python -m pip install --quiet pyyaml

      - name: Проверка структуры, данных и описаний сборок
        run: python3 tools/validate_repo.py

      - name: Установка Godot без графического интерфейса
        if: needs.detect.outputs.has_project == 'true'
        run: |
          set -euo pipefail
          zip="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${zip}"
          curl -fsSL "$url" -o /tmp/godot.zip
          unzip -q -o /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Импорт проекта и проверка ошибок скриптов
        if: needs.detect.outputs.has_project == 'true'
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit 2>&1 | tee /tmp/godot-import.log
          if grep -qE 'SCRIPT ERROR|Parse Error|ERROR: .*Failed' /tmp/godot-import.log; then
            echo "::error::Обнаружены ошибки при импорте или разборе скриптов GDScript"
            exit 1
          fi

      - name: Пробный запуск главной сцены
        if: needs.detect.outputs.has_project == 'true'
        run: |
          set -euo pipefail
          if grep -q '^run/main_scene' project.godot; then
            timeout 120 godot --headless --path . --quit-after 120 2>&1 | tee /tmp/godot-boot.log
            if grep -qE 'SCRIPT ERROR|Parse Error' /tmp/godot-boot.log; then
              echo "::error::Ошибки при запуске главной сцены"
              exit 1
            fi
          else
            echo "Главная сцена ещё не настроена — пробный запуск пропущен."
          fi

      - name: Итог
        run: |
          echo "Проверка репозитория завершена успешно"
          echo "Наличие Godot-проекта: ${{ needs.detect.outputs.has_project }}, наличие Android-пресета: ${{ needs.detect.outputs.has_preset }}"

  # Реальная сборка отладочного APK. Включается автоматически, как только в
  # репозитории появляются project.godot и Android-пресет в export_presets.cfg.
  android-apk:
    name: Сборка Android APK
    needs: [detect, validate]
    if: needs.detect.outputs.has_project == 'true' && needs.detect.outputs.has_preset == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Получение исходников
        uses: actions/checkout@v4

      - name: Кэш исполняемого файла Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/godot
          key: godot-4.7.2-linux-x86_64

      - name: Установка Godot
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          if [ ! -x "$HOME/.local/bin/godot" ]; then
            zip="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            curl -fsSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${zip}" -o /tmp/godot.zip
            unzip -q -o /tmp/godot.zip -d /tmp/godot
            install -m 0755 "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/.local/bin/godot"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/godot" --version

      - name: Кэш шаблонов экспорта
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-templates-4.7.2-stable

      - name: Установка шаблонов экспорта
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          tmp=$(mktemp -d)
          unzip -q /tmp/templates.tpz -d "$tmp"
          mv "$tmp/templates/"* "$dest/"
          rm -rf "$tmp" /tmp/templates.tpz
          ls "$dest" | head -5

      - name: Установка Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Установка Android SDK
        uses: android-actions/setup-android@v3

      - name: "Android SDK: платформа и сборочные инструменты"
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Отладочный ключ подписи
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Настройки экспорта Godot
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Шаблон сборки Android и импорт ассетов
        run: |
          set -euo pipefail
          godot --headless --path . --install-android-build-template
          godot --headless --path . --editor --quit

      - name: Экспорт отладочного APK
        run: |
          set -euo pipefail
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/AshenWorld-debug.apk
          size=$(stat -c%s build/android/AshenWorld-debug.apk)
          echo "Размер APK: $size байт"
          [ "$size" -gt 1000000 ] || { echo "::error::APK отсутствует или подозрительно мал"; exit 1; }

      - name: Выгрузка APK как артефакта
        uses: actions/upload-artifact@v4
        with:
          name: AshenWorld-debug-apk
          path: build/android/AshenWorld-debug.apk
          retention-days: 14
