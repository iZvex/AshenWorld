name: Проверки и сборка ASHEN WORLD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Разделяем очереди для отправки кода и ручного запуска, чтобы ручной
# прогон не отменялся автоматическим и наоборот.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  # Определяем, что уже появилось в репозитории. Пока это только спецификация,
  # тяжёлые задания честно пропускаются, а не завершаются ошибкой.
  detect:
    name: Состав репозитория
    runs-on: ubuntu-latest
    outputs:
      has_project: ${{ steps.d.outputs.has_project }}
      has_preset: ${{ steps.d.outputs.has_preset }}
    steps:
      - name: Получение исходников
        uses: actions/checkout@v4
      - name: Проверка наличия Godot-проекта и Android-пресета
        id: d
        run: |
          has_project=false
          has_preset=false
          if [ -f project.godot ]; then has_project=true; fi
          if [ -f export_presets.cfg ] && grep -q 'platform="Android"' export_presets.cfg; then
            has_preset=true
          fi
          echo "has_project=$has_project" >> "$GITHUB_OUTPUT"
          echo "has_preset=$has_preset" >> "$GITHUB_OUTPUT"
          printf 'has_project=%s  has_preset=%s\n' "$has_project" "$has_preset"

  validate:
    name: Проверка репозитория и скриптов
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - name: Получение исходников
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка PyYAML
        run: python -m pip install --quiet pyyaml

      - name: Проверка структуры, данных и описаний сборок
        run: python3 tools/validate_repo.py

      - name: Сверка справочника API с кодом
        run: python3 tools/api_report.py --check

      - name: Установка Godot без графического интерфейса
        if: needs.detect.outputs.has_project == 'true'
        run: |
          set -euo pipefail
          zip="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${zip}"
          curl -fsSL "$url" -o /tmp/godot.zip
          unzip -q -o /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Импорт проекта и проверка ошибок скриптов
        if: needs.detect.outputs.has_project == 'true'
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit 2>&1 | tee /tmp/godot-import.log
          if grep -qE 'SCRIPT ERROR|Parse Error|ERROR: .*Failed' /tmp/godot-import.log; then
            echo "::error::Обнаружены ошибки при импорте или разборе скриптов GDScript"
            exit 1
          fi

      - name: Пробный запуск главной сцены
        if: needs.detect.outputs.has_project == 'true'
        run: |
          set -euo pipefail
          if grep -q '^run/main_scene' project.godot; then
            timeout 120 godot --headless --path . --quit-after 120 2>&1 | tee /tmp/godot-boot.log
            if grep -qE 'SCRIPT ERROR|Parse Error' /tmp/godot-boot.log; then
              echo "::error::Ошибки при запуске главной сцены"
              exit 1
            fi
          else
            echo "Главная сцена ещё не настроена — пробный запуск пропущен."
          fi

      - name: Точечные проверки игровой логики
        if: needs.detect.outputs.has_project == 'true'
        run: |
          set -euo pipefail
          for test_script in tests/test_combat.gd tests/test_campaign.gd tests/test_equipment.gd tests/test_progression.gd tests/test_saves.gd tests/test_modes.gd tests/test_ui.gd tests/test_presentation.gd tests/test_input.gd; do
            name="$(basename "$test_script")"
            log="/tmp/${name}.log"
            echo "::group::$name"
            timeout 180 godot --headless --path . --script "$test_script" 2>&1 | tee "$log"
            if grep -qE 'SCRIPT ERROR|Parse Error|ERROR:|leaked|still in use' "$log"; then
              echo "::error::Ошибки в проверке $name"
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Итог
        run: |
          echo "Проверка репозитория завершена успешно"
          echo "Наличие Godot-проекта: ${{ needs.detect.outputs.has_project }}, наличие Android-пресета: ${{ needs.detect.outputs.has_preset }}"

  # Реальная сборка отладочного APK. Включается автоматически, как только в
  # репозитории появляются project.godot и Android-пресет в export_presets.cfg.
  android-apk:
    name: Сборка Android APK
    needs: [detect, validate]
    if: needs.detect.outputs.has_project == 'true' && needs.detect.outputs.has_preset == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Получение исходников
        uses: actions/checkout@v4

      - name: Кэш исполняемого файла Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/godot
          key: godot-4.7.2-linux-x86_64

      - name: Установка Godot
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          if [ ! -x "$HOME/.local/bin/godot" ]; then
            zip="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            curl -fsSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${zip}" -o /tmp/godot.zip
            unzip -q -o /tmp/godot.zip -d /tmp/godot
            install -m 0755 "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/.local/bin/godot"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/godot" --version

      - name: Кэш шаблонов экспорта
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-templates-4.7.2-stable

      - name: Установка шаблонов экспорта
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          tmp=$(mktemp -d)
          unzip -q /tmp/templates.tpz -d "$tmp"
          mv "$tmp/templates/"* "$dest/"
          rm -rf "$tmp" /tmp/templates.tpz
          ls "$dest" | head -5

      - name: Установка Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Установка Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Пакет tools устарел и отсутствует в актуальном репозитории SDK,
          # поэтому дополнительные пакеты ставим сами на следующем шаге.
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: "Android SDK: платформа и сборочные инструменты"
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Отладочный ключ подписи
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Настройки экспорта Godot
        run: |
          set -euo pipefail
          sdk_path="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$sdk_path"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          echo "Путь к Android SDK: $sdk_path"

      - name: Импорт ассетов
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit

      - name: Экспорт отладочного APK
        run: |
          set -euo pipefail
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/AshenWorld-debug.apk
          size=$(stat -c%s build/android/AshenWorld-debug.apk)
          echo "Размер APK: $size байт"
          [ "$size" -gt 1000000 ] || { echo "::error::APK отсутствует или подозрительно мал"; exit 1; }

      - name: Проверка подписи APK
        run: |
          set -euo pipefail
          sdk_path="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          apksigner_bin=$(find "$sdk_path/build-tools" -type f -name apksigner | sort | tail -1)
          "$apksigner_bin" verify --verbose build/android/AshenWorld-debug.apk

      - name: Проверка содержимого APK
        run: |
          set -euo pipefail
          sdk_path="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          aapt_bin=$(find "$sdk_path/build-tools" -type f -name aapt | sort | tail -1)
          # Старый aapt ругается на новые атрибуты манифеста, но данные пакета
          # всё равно выводит, поэтому его код возврата и поток ошибок здесь
          # не решают исход: проверяем именно содержимое вывода.
          "$aapt_bin" dump badging build/android/AshenWorld-debug.apk > /tmp/apk-badging.txt 2>/dev/null || true
          head -6 /tmp/apk-badging.txt
          grep -q "package: name='com.izvex.ashenworld'" /tmp/apk-badging.txt
          grep -q "application-label:'ASHEN WORLD'" /tmp/apk-badging.txt
          echo "Имя пакета и название приложения совпадают с пресетом"

      - name: Проверка офлайн-пакета и параметров полировки
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import zipfile

          apk = "build/android/AshenWorld-debug.apk"
          with zipfile.ZipFile(apk) as archive:
              balance = json.loads(archive.read("assets/data/balance.json"))
              presentation = balance["presentation"]
              assert balance["version"] == 8
              assert balance["save"]["format_version"] == 8
              assert balance["save"]["default_settings"]["effects_enabled"] is True
              assert presentation["ui_refresh_seconds"] <= 0.2
              assert presentation["ambient_particles"]["amount"] < 18
              assert presentation["effect_pool"]["capacity"] <= 16
              assert presentation["effect_pool"]["skill_font_size"] >= 18
              assert len(presentation["audio"]["sounds"]) == 8
              interface = presentation["interface"]
              hud = interface["hud"]
              names = archive.namelist()
              assert interface["fonts"]["default"] >= 20
              assert min(interface["fonts"]["node_sizes"].values()) >= 18
              assert len(interface["navigation"]["tabs"]) == 6
              assert len(interface["navigation"]["tab_order"]) == 6
              assert "BottomTabs" not in interface["layout"]["grid_columns"]
              assert len(interface["layout"]["nav_ratios"]) == 6
              assert interface["layout"]["grid_columns"]["ArenaEnemies"] == 3
              assert interface["layout"]["background_texture"] == "res://assets/ui/background_sketch.png"
              assert interface["minimum_sizes"]["HeroHealthBar"][1] >= 26
              assert interface["minimum_sizes"]["EnemyMiniBar1"] == [124, 10]
              assert interface["minimum_sizes"]["EnemyNameLabel1"] == [0, 46]
              pool = balance["presentation"]["effect_pool"]
              assert pool["spark_capacity"] >= 16 and pool["slash_capacity"] >= 2
              assert pool["spark_life_seconds"] > 0 and pool["slash_life_seconds"] > 0
              assert len(pool["death_tint_rgba"]) == 4 and pool["death_tint_rgba"][3] < 1.0
              assert len(pool["hit_flash_rgba"]) == 4 and pool["death_fade_seconds"] > 0
              assert len(hud["nav_icons"]) == 6 and hud["nickname"].strip() != ""
              assert len(hud["stub_icons"]) >= 8
              assert len(hud["stub_labels"]) >= 4 and hud["stub_text"] == "СКОРО"
              assert hud["portrait_texture"] == "res://assets/ui/hero_portrait.png"
              assert hud["enemy_texture"] == "res://assets/ui/icons/enemy_wraith.svg"
              assert hud["hero_figure"].endswith("hero_battle.png")
              assert len(hud["enemy_figures"]["figures"]) >= 3
              assert len(hud["enemy_figures"]["by_id"]) >= 10
              assert any("hero_battle" in name and name.endswith(".ctex") for name in names)
              for figure in ["ash_wraith", "bone_legionnaire", "ash_hound"]:
                  assert any(figure in name and name.endswith(".ctex") for name in names), figure
              assert hud["battle_overlay"]["orb_radius"]["StrikeButton"] >= 56
              assert hud["battle_overlay"]["orb_radius"]["GuardButton"] >= 44
              assert interface["minimum_sizes"]["StrikeButton"] == [124, 124]
              assert interface["minimum_sizes"]["GuardButton"] == [96, 96]
              overlay = hud["battle_overlay"]
              assert overlay["icons"]["StrikeButton"].endswith("crossed_swords_icon.png")
              assert overlay["icons"]["GuardButton"].endswith("shield_icon.png")
              assert overlay["cooldown_ring"]["thickness"] >= 4
              assert overlay["auto_delay_seconds"] >= 0.5
              assert overlay["slots"] == 2 and overlay["slot_tooltip"] == "СКОРО"
              assert overlay["auto_label"].strip() != ""
              assert interface["minimum_sizes"]["SkillSlot3"] == [52, 52]
              assert interface["minimum_sizes"]["SkillSlot4"] == [52, 52]
              assert interface["minimum_sizes"]["AutoButton"] == [160, 44]
              assert interface["minimum_sizes"]["BottomBar"] == [0, 130]
              assert interface["minimum_sizes"]["BottomTabs"] == [0, 114]
              anim = interface["animations"]
              assert 0 < anim["section_fade_seconds"] <= 0.45
              assert 0 < anim["nav_glow_seconds"] <= 0.45
              assert 0 < anim["press_seconds"] <= 0.4
              assert anim["nav_glow_brightness"] > 1.0
              assert interface["fonts"]["node_sizes"]["StrikeCooldownLabel"] == 18
              assert interface["fonts"]["node_sizes"]["GuardCooldownLabel"] == 18
              assert interface["fonts"]["node_sizes"]["AutoButton"] == 18
              assert any("crossed_swords_icon.png" in name and name.endswith(".ctex") for name in names)
              assert any("shield_icon.png" in name and name.endswith(".ctex") for name in names)
              assert any("background_sketch" in name and name.endswith(".ctex") for name in names)
              assert any("hero_portrait" in name and name.endswith(".ctex") for name in names)
              assert any("enemy_wraith.svg" in name and name.endswith(".ctex") for name in names)
              assert sum(name.endswith(".ctex") for name in names) >= 20
              assert any(name.endswith("presentation_catalog.gdc") for name in names)
              assert any(name.endswith("test_presentation.gdc") for name in names)
              assert any(name.endswith("test_ui.gdc") for name in names)
              assert any(name.endswith("test_input.gdc") for name in names)
          print("APK содержит баланс v8, HUD наброска, шесть разделов, офлайн-настройки и скрипты полировки")
          PY
          sdk_path="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          aapt_bin=$(find "$sdk_path/build-tools" -type f -name aapt | sort | tail -1)
          "$aapt_bin" dump badging build/android/AshenWorld-debug.apk > /tmp/apk-badging.txt 2>/dev/null || true
          if grep -q "android.permission.INTERNET" /tmp/apk-badging.txt; then
            echo "::error::APK запрашивает доступ к интернету"
            exit 1
          fi
          echo "Разрешение на интернет в APK отсутствует"

      - name: Выгрузка APK как артефакта
        uses: actions/upload-artifact@v4
        with:
          name: AshenWorld-debug-apk
          path: build/android/AshenWorld-debug.apk
          retention-days: 14
